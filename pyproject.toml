[project]
name = "qualitytrack"
version = "0.1.0"
description = "Outil de Maitrise Statistique des Procedes (SPC) et de suivi des indicateurs qualite"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["core*", "database*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
